<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>__TITLE__</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
        <link rel="stylesheet" href="./style.css" />
        <script>
            window.DATA = __DATA_JSON__
            window.FILE_PATH = __FILE_PATH_JSON__
            window.MAX_LEVEL = __MAX_LEVEL__
        </script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    </head>
    <body x-data="app()" x-init="init()">
        <h1>__TITLE__</h1>
        <div class="meta"><span x-text="totalCount"></span> special comment(s) extracted</div>

        <div class="toolbar">
            <div class="slider-group">
                <label for="level-slider">Min level:</label>
                <input id="level-slider" type="range" min="0" :max="MAX_LEVEL" step="1" x-model.number="minLevel" />
                <span class="val" x-text="'≥ ' + minLevel"></span>
            </div>
            <button @click="setAllCollapsed(true)">Collapse all</button>
            <button @click="setAllCollapsed(false)">Expand all</button>
        </div>

        <div class="hint">Click a comment to open it in VS Code. Click ▶/▼ to fold. Raise the slider to hide less-important comments.</div>

        <div id="comments">
            <template x-for="item in visibleRoots" :key="item.key">
                <div x-data="node(item, $data)"></div>
            </template>
        </div>

        <div class="footer" x-text="footerText"></div>

        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
        <script src="./script.js"></script>

        <!-- Recursive node template -->
        <template id="node-template">
            <div class="node" :class="{ collapsed }">
                <div class="row" :title="item.raw_line.split('#.')[0] + '(L' + item.line + ')'" @click="open(item.line)">
                    <span class="caret" :class="{ clickable: kids.length }" @click.stop="collapsed = !collapsed" x-html="caretHtml"></span>
                    <div class="body">
                        <span class="lineno" x-text="'L' + item.line"></span>
                        <span x-html="md"></span>
                        <template x-if="item.level > 0">
                            <span class="levelpill" x-text="'L' + item.level"></span>
                        </template>
                    </div>
                </div>
                <template x-if="kids.length">
                    <div class="children">
                        <template x-for="child in kids" :key="child.key">
                            <div x-data="node(child, root)"></div>
                        </template>
                    </div>
                </template>
            </div>
        </template>
    </body>
</html>
